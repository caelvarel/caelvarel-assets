name: Materialize staged assets

on:
  push:
    branches: [main]
    paths:
      - 'staging/hp_frame.png.b64'
      - 'staging/hp_fill.png.b64'
      - '.github/workflows/materialize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Unity-ready PNG assets
        run: |
          mkdir -p hp-bar
          base64 -d staging/hp_frame.png.b64 > hp-bar/hp_frame.png
          base64 -d staging/hp_fill.png.b64 > hp-bar/hp_fill.png
      - name: Commit generated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hp-bar/hp_frame.png hp-bar/hp_fill.png
          git diff --cached --quiet || git commit -m "Materialize HP bar PNG assets"
          git push
