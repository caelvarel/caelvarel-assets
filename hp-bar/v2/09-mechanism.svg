<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f7fa"/><rect width="1200" height="86" fill="#1c2737"/><text x="42" y="53" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">仕組みはこれだけ</text><text x="42" y="76" font-family="sans-serif" font-size="17" fill="#bed2e6">現在HP ÷ 最大HP を Image.fillAmount に入れます。</text><g font-family="sans-serif"><rect x="80" y="235" width="210" height="170" rx="16" fill="#fff" stroke="#b9c3cd" stroke-width="3"/><text x="105" y="285" font-size="25" font-weight="700" fill="#2d3741">現在HP</text><text x="135" y="350" font-size="44" font-weight="700" fill="#2678d2">40</text><text x="390" y="340" font-size="58" font-weight="700" fill="#32465a">÷</text><rect x="540" y="235" width="210" height="170" rx="16" fill="#fff" stroke="#b9c3cd" stroke-width="3"/><text x="565" y="285" font-size="25" font-weight="700" fill="#2d3741">最大HP</text><text x="590" y="350" font-size="44" font-weight="700" fill="#2678d2">100</text><text x="820" y="340" font-size="58" font-weight="700" fill="#32465a">=</text><rect x="945" y="235" width="210" height="170" rx="16" fill="#fff" stroke="#b9c3cd" stroke-width="3"/><text x="970" y="285" font-size="25" font-weight="700" fill="#2d3741">fillAmount</text><text x="1000" y="350" font-size="44" font-weight="700" fill="#2678d2">0.4</text></g><image href="https://raw.githubusercontent.com/caelvarel/caelvarel-assets/main/hp-bar/v2/01-hp-frame.svg" x="320" y="485" width="500" height="94"/><rect x="374" y="515" width="154" height="38" rx="12" fill="#2ee772"/><text x="415" y="630" font-family="sans-serif" font-size="26" font-weight="700" fill="#32465a">40%だけ表示</text></svg>