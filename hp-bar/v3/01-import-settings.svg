<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="72" font-family="Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#141e2d">1. 画像をSpriteとして読み込む</text><text x="48" y="110" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">hp_frame.png と hp_fill.png を Assets/UI/HP に入れる</text><rect x="60" y="150" rx="18" width="510" height="480" fill="#24282f"/><text x="82" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">hp_frame.png / Import Settings</text><g font-family="sans-serif" font-size="18"><text x="90" y="250" fill="#d2dae6">Texture Type</text><rect x="240" y="220" rx="8" width="280" height="38" fill="#3c414a"/><text x="255" y="246" fill="#6ecdff" font-weight="700">Sprite (2D and UI)</text><text x="90" y="312" fill="#d2dae6">Sprite Mode</text><rect x="240" y="282" rx="8" width="280" height="38" fill="#3c414a"/><text x="255" y="308" fill="#fff">Single</text><text x="90" y="374" fill="#d2dae6">Mesh Type</text><rect x="240" y="344" rx="8" width="280" height="38" fill="#3c414a"/><text x="255" y="370" fill="#fff">Full Rect</text><text x="90" y="436" fill="#d2dae6">Pixels Per Unit</text><rect x="240" y="406" rx="8" width="280" height="38" fill="#3c414a"/><text x="255" y="432" fill="#fff">100</text><rect x="350" y="548" rx="10" width="170" height="50" fill="#2b74cf"/><text x="405" y="580" fill="#fff" font-weight="700">Apply</text></g><rect x="630" y="150" rx="18" width="510" height="480" fill="#24282f"/><text x="652" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">Project</text><g font-family="sans-serif" font-size="18" fill="#fff"><text x="670" y="250">▾ Assets</text><text x="705" y="305">▾ UI</text><text x="740" y="360">▾ HP</text><text x="780" y="415" fill="#8fd6ff">hp_frame.png</text><text x="780" y="465" fill="#8fd6ff">hp_fill.png</text></g><text x="662" y="540" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#87d6ff">2枚を別ファイルで使う。</text><text x="662" y="578" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#d2dae6">切り抜きやSprite Sheet化は不要。</text></svg>