<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="72" font-family="Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#141e2d">3. Fillを「減る画像」にする</text><text x="48" y="110" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">Image Type を Filled にすると、fillAmount 0〜1 で長さを変えられる</text><rect x="90" y="150" rx="18" width="580" height="500" fill="#24282f"/><text x="112" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">Fill / Image</text><g font-family="sans-serif" font-size="18"><text x="125" y="250" fill="#d2dae6">Source Image</text><rect x="275" y="220" rx="8" width="300" height="38" fill="#3c414a"/><text x="290" y="246" fill="#6ecdff" font-weight="700">hp_fill</text><text x="125" y="312" fill="#d2dae6">Image Type</text><rect x="275" y="282" rx="8" width="300" height="38" fill="#3c414a"/><text x="290" y="308" fill="#6ecdff" font-weight="700">Filled</text><text x="125" y="374" fill="#d2dae6">Fill Method</text><rect x="275" y="344" rx="8" width="300" height="38" fill="#3c414a"/><text x="290" y="370" fill="#fff">Horizontal</text><text x="125" y="436" fill="#d2dae6">Fill Origin</text><rect x="275" y="406" rx="8" width="300" height="38" fill="#3c414a"/><text x="290" y="432" fill="#fff">Left</text><text x="125" y="498" fill="#d2dae6">Fill Amount</text><rect x="275" y="468" rx="8" width="300" height="38" fill="#3c414a"/><text x="290" y="494" fill="#6ecdff" font-weight="700">1.0</text></g><rect x="735" y="150" rx="18" width="375" height="500" fill="#24282f"/><text x="757" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">Preview</text><g font-family="sans-serif" font-size="18" font-weight="700" fill="#fff"><rect x="785" y="240" rx="14" width="275" height="46" fill="#141a22" stroke="#576777" stroke-width="2"/><rect x="794" y="248" rx="10" width="255" height="30" fill="#29d652" stroke="#7bff93" stroke-width="2"/><text x="790" y="320">1.0 = 100%</text><rect x="785" y="355" rx="14" width="275" height="46" fill="#141a22" stroke="#576777" stroke-width="2"/><rect x="794" y="363" rx="10" width="153" height="30" fill="#29d652" stroke="#7bff93" stroke-width="2"/><text x="790" y="435">0.6 = 60%</text><rect x="785" y="470" rx="14" width="275" height="46" fill="#141a22" stroke="#576777" stroke-width="2"/><rect x="794" y="478" rx="10" width="64" height="30" fill="#29d652" stroke="#7bff93" stroke-width="2"/><text x="790" y="550">0.25 = 25%</text></g></svg>