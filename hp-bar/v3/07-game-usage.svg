<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="72" font-family="Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#141e2d">7. ゲーム側ではこう使う</text><text x="48" y="110" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">テスト用キーではなく、実際のダメージ処理から TakeDamage を呼ぶ</text><rect x="90" y="210" rx="20" width="300" height="130" fill="#703643" stroke="#89c2e5" stroke-width="2"/><text x="114" y="258" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">EnemyAttack</text><text x="114" y="302" font-family="sans-serif" font-size="18" fill="#e1e8f0">player.TakeDamage(25);</text><line x1="402" y1="274" x2="438" y2="274" stroke="#2c90ff" stroke-width="7"/><polygon points="438,262 460,274 438,286" fill="#2c90ff"/><rect x="470" y="210" rx="20" width="300" height="130" fill="#2c5884" stroke="#89c2e5" stroke-width="2"/><text x="494" y="258" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">PlayerHealth</text><text x="494" y="302" font-family="sans-serif" font-size="18" fill="#e1e8f0">HP 100 → 75</text><line x1="782" y1="274" x2="818" y2="274" stroke="#2c90ff" stroke-width="7"/><polygon points="818,262 840,274 818,286" fill="#2c90ff"/><rect x="850" y="210" rx="20" width="260" height="130" fill="#236959" stroke="#89c2e5" stroke-width="2"/><text x="874" y="258" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">HPBarUI</text><text x="874" y="302" font-family="sans-serif" font-size="18" fill="#e1e8f0">SetHP(75, 100)</text><rect x="190" y="430" rx="20" width="820" height="160" fill="#fff" stroke="#d2dae4" stroke-width="2"/><text x="225" y="475" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">回復アイテムなら</text><text x="225" y="515" font-family="monospace" font-size="26" font-weight="700" fill="#20734d">player.Heal(20);</text><text x="530" y="475" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">敵の攻撃なら</text><text x="530" y="515" font-family="monospace" font-size="26" font-weight="700" fill="#a13a44">player.TakeDamage(damage);</text><text x="225" y="558" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#141e2d">HPバー側にゲームルールを書かない。UIを差し替えてもHP処理はそのまま使える。</text></svg>