<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="72" font-family="Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#141e2d">4. HPBarUIとPlayerHealthをつなぐ</text><text x="48" y="110" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">UIは表示だけ。HPの値は PlayerHealth 側に持たせる</text><rect x="65" y="145" rx="18" width="515" height="505" fill="#24282f"/><text x="87" y="185" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">HPBar / Inspector</text><g font-family="sans-serif" font-size="18"><text x="95" y="245" fill="#d2dae6">Fill Image</text><rect x="245" y="216" rx="8" width="285" height="38" fill="#3c414a"/><text x="260" y="242" fill="#6ecdff" font-weight="700">Fill</text><text x="95" y="309" fill="#d2dae6">HP Text</text><rect x="245" y="280" rx="8" width="285" height="38" fill="#3c414a"/><text x="260" y="306" fill="#6ecdff" font-weight="700">HPText (TMP)</text></g><text x="97" y="405" font-family="sans-serif" font-size="21" font-weight="700" fill="#65d5ff">HPBarUI.cs</text><text x="97" y="448" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#d7dfea">SetHP(current, max) を受け取り、</text><text x="97" y="482" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#d7dfea">fillAmount と数値表示だけを更新。</text><rect x="630" y="145" rx="18" width="510" height="505" fill="#24282f"/><text x="652" y="185" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="700" fill="#fafcff">役割を分ける</text><rect x="720" y="220" rx="16" width="330" height="72" fill="#3f4f62" stroke="#78b4dd" stroke-width="2"/><text x="748" y="250" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">Enemy / Item</text><text x="748" y="276" font-family="Noto Sans JP,sans-serif" font-size="16" fill="#dce4ee">ダメージ・回復を発生</text><polygon points="875,310 895,310 885,327" fill="#4dd0ff"/><rect x="720" y="350" rx="16" width="330" height="72" fill="#2e5982" stroke="#78b4dd" stroke-width="2"/><text x="748" y="380" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">PlayerHealth</text><text x="748" y="406" font-family="Noto Sans JP,sans-serif" font-size="16" fill="#dce4ee">currentHP を管理</text><polygon points="875,440 895,440 885,457" fill="#4dd0ff"/><rect x="720" y="480" rx="16" width="330" height="72" fill="#246c5a" stroke="#78b4dd" stroke-width="2"/><text x="748" y="510" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">HPBarUI</text><text x="748" y="536" font-family="Noto Sans JP,sans-serif" font-size="16" fill="#dce4ee">見た目だけ更新</text></svg>