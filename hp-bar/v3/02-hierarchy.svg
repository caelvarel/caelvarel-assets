<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="72" font-family="Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#141e2d">2. CanvasにHPバーを組む</text><text x="48" y="110" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#59677d">Background → Fill → Frame → HPText の順に重ねる</text><rect x="65" y="150" rx="18" width="520" height="490" fill="#24282f"/><text x="87" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">Hierarchy</text><g font-family="Noto Sans JP,sans-serif" font-size="20" fill="#fff"><text x="104" y="250" font-weight="700">▾ Canvas</text><text x="142" y="308" font-weight="700">▾ HPBar</text><text x="180" y="366">□ Background</text><text x="180" y="424">□ Fill</text><text x="180" y="482">□ Frame</text><text x="180" y="540" fill="#76bcff">□ HPText (TMP)</text></g><rect x="640" y="150" rx="18" width="500" height="490" fill="#24282f"/><text x="662" y="190" font-family="sans-serif" font-size="20" font-weight="700" fill="#fafcff">HPBar RectTransform</text><rect x="710" y="245" rx="16" width="360" height="80" fill="#141a22" stroke="#78d1ff" stroke-width="3"/><rect x="730" y="263" rx="12" width="285" height="44" fill="#25b84f" stroke="#8aff9f" stroke-width="2"/><text x="728" y="380" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">Size: 420 × 56</text><text x="728" y="420" font-family="Noto Sans JP,sans-serif" font-size="19" fill="#d2dae6">Anchor: 左上</text><text x="728" y="458" font-family="sans-serif" font-size="19" fill="#d2dae6">Pos X: 24 / Pos Y: -24</text><text x="728" y="520" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#87d6ff">Background は標準Imageを暗色に。</text><text x="728" y="558" font-family="Noto Sans JP,sans-serif" font-size="18" fill="#87d6ff">Frame は最後に置いて枠を手前へ。</text></svg>